<!doctype html>
<html lang="fa" dir="rtl" class="bg-bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathly — مسیر پیشرفت من</title>
    <meta name="description" content="سامانه جامع و یکپارچه برنامه‌ریزی تحصیلی، مدیریت پروژه‌ها، توسعه مهارت‌ها و آمادگی مسابقات با تقویم شمسی" />
    <meta property="og:title" content="Pathly — مسیر پیشرفت من" />
    <meta property="og:description" content="سامانه جامع و یکپارچه برنامه‌ریزی تحصیلی، مدیریت پروژه‌ها، توسعه مهارت‌ها و آمادگی مسابقات با تقویم شمسی" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Preload core local Vazirmatn font files for instant, offline-capable render -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Monospace font for code/debug blocks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('pathly_theme_mode');
          var isDark;
          if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'light') {
            isDark = false;
          } else {
            var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            isDark = mql ? mql.matches : true;
          }
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-resolved-theme', isDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-transparent text-fg antialiased font-sans selection:bg-fg selection:text-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
