<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathly — مسیر پیشرفت من</title>
    <meta name="description" content="سامانه جامع و یکپارچه برنامه‌ریزی تحصیلی، مدیریت پروژه‌ها، توسعه مهارت‌ها و آمادگی مسابقات با تقویم شمسی" />
    <meta property="og:title" content="Pathly — مسیر پیشرفت من" />
    <meta property="og:description" content="سامانه جامع و یکپارچه برنامه‌ریزی تحصیلی، مدیریت پروژه‌ها، توسعه مهارت‌ها و آمادگی مسابقات با تقویم شمسی" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Preload core local Vazirmatn font files for instant, offline-capable render -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Monospace font for code/debug blocks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var mode = 'dark';
          // 1. Check standalone theme mode preference first
          var standalone = localStorage.getItem('pathly_theme_mode');
          if (standalone) {
            mode = standalone;
          } else {
            // 2. Check full cached app state
            var saved = localStorage.getItem('pathly_app_data_v3_clean');
            if (saved) {
              var data = JSON.parse(saved);
              if (data && data.profile) {
                mode = (data.profile.customization && data.profile.customization.themeMode) || data.profile.theme || 'dark';
              }
            }
          }

          var isDark = true;
          if (mode === 'light') {
            isDark = false;
          } else if (mode === 'system') {
            var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            isDark = mql ? mql.matches : false;
          } else {
            // Any other dark theme mode (dark, cyber-purple, emerald-matrix, ocean-deep, sunset-gold, rose-quartz)
            isDark = true;
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#000000';
            document.documentElement.style.color = '#ECEAE6';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F5F4F1';
            document.documentElement.style.color = '#23211E';
          }
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.setAttribute('data-resolved-theme', isDark ? 'dark' : 'light');

          // Read accent color from localStorage or cached state for instant anti-flash render
          var accent = localStorage.getItem('pathly_accent_color');
          if (!accent) {
            var themeToAccent = {
              'sunset-gold': 'amber',
              'cyber-purple': 'violet',
              'emerald-matrix': 'emerald',
              'ocean-deep': 'blue',
              'rose-quartz': 'rose',
              'cyan-matrix': 'cyan'
            };
            accent = themeToAccent[mode] || 'amber';
          }
          document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#000000';
          document.documentElement.style.color = '#ECEAE6';
          document.documentElement.setAttribute('data-accent', 'amber');
        }
      })();
    </script>
  </head>
  <body class="bg-[#F5F4F1] text-[#23211E] dark:bg-[#000000] dark:text-[#ECEAE6] antialiased font-sans selection:bg-amber-200 dark:selection:bg-amber-950/70">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
